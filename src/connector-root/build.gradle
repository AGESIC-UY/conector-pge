plugins {
    id "org.owasp.dependencycheck" version "8.0.2" apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'pmd'
    apply plugin: 'idea'
    apply plugin: 'org.owasp.dependencycheck'

    group 'gub.agesic.connector'
    targetCompatibility = '1.8'
    sourceCompatibility = '1.8'

    ext.springVersion = '4.3.12.RELEASE'
    ext.springSecurityVersion = '4.2.3.RELEASE'
    ext.hamcrestVersion = '1.3'
    ext.servletApiVersion = "3.1.0"
    ext.fileUploadVersion = "1.3.3"
    ext.junitVersion = "4.12"

    // Usage gradle connector-web:build -Denvironment=develop -Dtomcat.home='complete with tomcat location' -Dwildfly.home='complete with wildfly location'
    // Usage gradle connector-integration:build -Denvironment=develop -Dtomcat.home='complete with tomcat location' -Dwildfly.home='complete with wildfly location'
    ext.tomcatDeployment = System.properties['tomcat.home'] + '/webapps'
    ext.wildflyDeployment = System.properties['wildfly.home'] + '/standalone/deployments'

    compileJava.options.encoding = 'UTF-8'

    repositories {
        mavenCentral()
        mavenLocal()
    }

    def slf4jLog4jVersion = '1.7.25'

    dependencies {
        compile "org.slf4j:slf4j-log4j12:$slf4jLog4jVersion"
    }
}